services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: iotdash-timescaledb
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432" # Secured to localhost
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iotdash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iotdash_dev}
      POSTGRES_DB: ${POSTGRES_DB:-iotdash_db}
    command: 
      - "postgres"
      - "-c"
      - "shared_buffers=512MB" # Scaled for a 2GB VPS
      - "-c"
      - "effective_cache_size=1GB"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./infrastructure/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - iot-network

  backend:
    build:
      context: ./backend
    container_name: iotdash-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://iotdash:iotdash_dev@timescaledb:5432/iotdash_db
    depends_on:
      - timescaledb
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - iot-network

  frontend:
    build:
      context: ./frontend
    container_name: iotdash-frontend
    restart: unless-stopped
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - iot-network

  nginx:
    image: nginx:alpine
    container_name: iotdash-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - iot-network

volumes:
  timescaledb_data:
    driver: local

networks:
  iot-network:
    driver: bridge