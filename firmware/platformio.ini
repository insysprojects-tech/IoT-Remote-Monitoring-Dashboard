; ====================================
; IoT Remote Monitoring Dashboard — PlatformIO Config
; ====================================
; ESP32-S3 WiFi & SIM7670 MQTT Dashboard

[platformio]
default_envs = esp32s3_wifi

[env:esp32s3_wifi]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    knolleary/PubSubClient@^2.8

[env:esp32s3_sim7670]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    vshymanskyy/TinyGSM@^0.11.7
build_flags =
    -DTINY_GSM_MODEM_SIM7600
    -DTINY_GSM_RX_BUFFER=1024
